<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한전 NDIS데이터관리원 필기 대비</title>
<style>
:root{
  --ink:#08141C; --panel:#0E212D; --line:#1C4459; --line2:#123141;
  --cy:#4FD1E8; --cy-dim:#2C8FA6; --amber:#F2B441; --red:#E4685D;
  --tx:#DCEAF0; --tx-dim:#7EA0B0; --ok:#5FD39A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--sans);line-height:1.6;
 background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
 background-size:28px 28px;background-position:-1px -1px}
.sheet{max-width:820px;margin:0 auto;padding:14px}
.frame{border:1px solid var(--line);background:rgba(8,20,28,.94);position:relative}
.frame::before,.frame::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--cy-dim)}
.frame::before{top:6px;left:6px;border-right:0;border-bottom:0}
.frame::after{bottom:6px;right:6px;border-left:0;border-top:0}

/* title block */
.tb{display:grid;grid-template-columns:1fr auto;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 11px/1.4 var(--mono);letter-spacing:.22em;color:var(--cy-dim);text-transform:uppercase}
h1{margin:6px 0 2px;font-size:21px;letter-spacing:-.02em}
.sub{font:500 12px/1.5 var(--mono);color:var(--tx-dim)}
.dday{text-align:right;font:700 34px/1 var(--mono);color:var(--amber)}
.dday span{display:block;font:600 10px/1.6 var(--mono);letter-spacing:.18em;color:var(--tx-dim)}

.specs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.specs div{padding:9px 10px;border-right:1px solid var(--line2);font:500 11px/1.5 var(--mono);color:var(--tx-dim)}
.specs div:last-child{border-right:0}
.specs b{display:block;font:700 14px/1.4 var(--sans);color:var(--tx);letter-spacing:-.01em}

nav{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
nav button{flex:1;min-width:88px;background:none;border:0;border-right:1px solid var(--line2);color:var(--tx-dim);
 padding:11px 6px;font:600 12px var(--sans);cursor:pointer;transition:.15s}
nav button:last-child{border-right:0}
nav button[aria-selected=true]{background:var(--panel);color:var(--cy);box-shadow:inset 0 -2px 0 var(--cy)}
nav button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

.pad{padding:16px}
.bar{height:3px;background:var(--line2);margin:0}
.bar i{display:block;height:100%;background:var(--cy);width:0;transition:width .3s}

.meta{display:flex;justify-content:space-between;align-items:baseline;font:600 11px var(--mono);color:var(--tx-dim);margin-bottom:12px;letter-spacing:.06em}
.meta em{font-style:normal;color:var(--amber)}

.card{border:1px solid var(--line);background:var(--panel);padding:16px;margin-bottom:12px}
.tag{font:700 10px var(--mono);letter-spacing:.14em;color:var(--cy-dim)}
.qt{margin:6px 0 14px;font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line2);color:var(--tx);
 padding:10px 12px;margin-bottom:7px;font:500 14px/1.45 var(--sans);cursor:pointer;transition:.12s;border-radius:2px}
.opt:hover:not(:disabled){border-color:var(--cy-dim)}
.opt:disabled{cursor:default;opacity:.75}
.opt .n{font:700 11px var(--mono);color:var(--cy-dim);margin-right:9px}
.opt.right{border-color:var(--ok);background:rgba(95,211,154,.10);opacity:1}
.opt.right .n{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:rgba(228,104,93,.10);opacity:1}
.opt.wrong .n{color:var(--red)}
.exp{border-left:2px solid var(--amber);padding:9px 12px;margin-top:11px;background:rgba(242,180,65,.06);
 font-size:13.5px;color:#E9D9B8}
.exp b{color:var(--amber)}

.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{background:transparent;border:1px solid var(--cy-dim);color:var(--cy);padding:9px 14px;
 font:600 12px var(--sans);cursor:pointer;border-radius:2px}
.btn:hover{background:rgba(79,209,232,.10)}
.btn.solid{background:var(--cy);color:#06171E;border-color:var(--cy)}
.btn.warn{border-color:var(--amber);color:var(--amber)}

.done{border:1px solid var(--amber);padding:20px;text-align:center;background:rgba(242,180,65,.05)}
.done .score{font:700 42px/1 var(--mono);color:var(--amber)}
.done p{color:var(--tx-dim);font-size:13px}

h2{font-size:15px;margin:22px 0 8px;letter-spacing:-.01em;color:var(--cy);
 border-bottom:1px solid var(--line2);padding-bottom:5px}
h2:first-child{margin-top:0}
h3{font-size:13px;margin:14px 0 5px;color:var(--amber);font-weight:700}
.pad ul{margin:0;padding-left:19px}
.pad li{font-size:13.5px;margin-bottom:4px}
code{font:600 12.5px var(--mono);background:rgba(79,209,232,.10);padding:1px 5px;color:var(--cy);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
th,td{border:1px solid var(--line2);padding:6px 8px;text-align:left}
th{background:rgba(79,209,232,.07);color:var(--cy);font-weight:700;font-size:11.5px}
.note{font-size:12px;color:var(--tx-dim);border:1px dashed var(--line);padding:10px 12px;margin-top:14px}
.plan{border:1px solid var(--line);margin-bottom:10px}
.plan .hd{display:flex;justify-content:space-between;background:rgba(79,209,232,.07);padding:8px 12px;
 font:700 12px var(--mono);color:var(--cy);letter-spacing:.08em}
.plan .bd{padding:11px 13px;font-size:13.5px}
@media(max-width:560px){
 .specs{grid-template-columns:repeat(2,1fr)}
 .specs div:nth-child(2){border-right:0}
 .dday{font-size:28px}
 h1{font-size:18px}
}
</style>

<div class="sheet"><div class="frame">
 <div class="tb">
  <div>
   <div class="eyebrow">KEPCO · 2026 NDIS DATA MANAGER</div>
   <h1>한국전력공사 NDIS데이터관리원 필기 대비</h1>
   <div class="sub">2차전형 · 8.20(목) · 서울 · 5배수</div>
  </div>

 </div>

 <div class="specs">

  <div>상식<b>10문항 / 20점</b>한국사·전력사업·회사</div>
  <div>인성검사<b>적·부</b>인재상·조직적합도</div>
  <div>합격발표<b>8.25(화)</b>→ 면접 9.1(화)</div>

</div></div>

{s:"도면",t:"지적도면",q:"지적도의 축척으로 옳지 않은 것은?",o:["1/500","1/1200","1/2400","1/5000"],a:3,e:"지적도 축척은 1/500·1/600·1/1000·1/1200·1/2400·1/3000·1/6000. <b>1/5000은 수치지형도(국가기본도) 축척</b>이지 지적도 축척이 아니다."},

{s:"도면",t:"지적도면",q:"지적도면의 도곽 크기로 옳은 것은?",o:["가로 30cm × 세로 40cm","가로 40cm × 세로 30cm","가로 50cm × 세로 40cm","가로 60cm × 세로 40cm"],a:1,e:"지적도면 도곽은 <b>가로 40cm × 세로 30cm</b>. 도곽선은 0.1mm 폭으로 제도한다."},
{s:"도면",t:"좌표계",q:"평면직각좌표계 중부원점의 경도와 위도는?",o:["동경 125°00′, 북위 38°00′","동경 127°00′, 북위 38°00′","동경 127°30′, 북위 38°00′","동경 129°00′, 북위 38°00′"],a:1,e:"중부원점 = <b>동경 127°00′ / 북위 38°00′</b>. 서부 125°, 동부 129°, 동해 131°(모두 북위 38°)."},

{s:"도면",t:"좌표계",q:"EPSG 코드와 좌표계가 잘못 연결된 것은?",o:["4326 – WGS84 경위도","5179 – UTM-K(GRS80)","5186 – 중부원점 GRS80","5181 – 세계측지계 UTM 52N"],a:3,e:"EPSG:5181은 <b>중부원점(경도 127°, Bessel 계열/구 좌표계)</b>. UTM 52N은 EPSG:32652다."},

{s:"도면",t:"지적공부",q:"경계점좌표등록부를 갖춰 두는 지역의 지적도 축척은?",o:["1/500","1/600","1/1200","1/3000"],a:0,e:"지적확정측량 또는 축척변경으로 경계점좌표등록부를 비치하는 지역(수치지역)은 축척 <b>1/500</b>이다."},

{s:"도면",t:"면적",q:"축척 1/1200 도면에서 도상거리 3cm의 실제 거리는?",o:["12m","24m","36m","360m"],a:2,e:"실거리 = 도상거리 × 축척분모 = 3cm × 1200 = 3,600cm = <b>36m</b>."},
{s:"도면",t:"면적",q:"축척 1/500 도면을 1/1000으로 축소하면 도상 면적은?",o:["1/2","1/4","2배","4배"],a:1,e:"면적은 축척비의 제곱에 비례한다. 축척분모가 2배가 되면 도상면적은 <b>1/4</b>."},

{s:"도면",t:"GIS",q:"벡터 데이터와 래스터 데이터 비교로 옳지 않은 것은?",o:["벡터는 위상(topology) 구조 표현에 유리하다","래스터는 중첩분석·연산에 유리하다","벡터는 셀 단위로 값을 저장한다","래스터는 해상도가 높을수록 용량이 커진다"],a:2,e:"<b>셀(픽셀) 단위 저장은 래스터</b>. 벡터는 점·선·면을 좌표로 저장한다."},
{s:"도면",t:"GIS",q:"위상관계(topology)의 3요소가 아닌 것은?",o:["인접성(adjacency)","연결성(connectivity)","포함성(containment)","유사성(similarity)"],a:3,e:"위상관계는 <b>인접성·연결성·포함성</b>. NDIS의 전산 입력 시 선로 연결성 검증에 직접 쓰인다."},
{s:"도면",t:"GIS",q:"공간데이터 파일 형식과 설명이 잘못된 것은?",o:["SHP – 도형·속성·인덱스 여러 파일로 구성","DXF – CAD 데이터 교환 형식","GeoJSON – 텍스트 기반 공간데이터 형식","DWG – 래스터 영상 저장 형식"],a:3,e:"<b>DWG는 AutoCAD의 벡터 도면 원본 형식</b>이다. 래스터는 TIFF/GeoTIFF, JPG 등."},
{s:"도면",t:"CAD",q:"AutoCAD에서 '@100,50'과 같이 입력하는 좌표 방식은?",o:["절대좌표","상대좌표","상대극좌표","절대극좌표"],a:1,e:"<b>@X,Y</b>는 직전 점 기준 <b>상대좌표</b>. <b>@거리&lt;각도</b>는 상대극좌표, 그냥 X,Y는 절대좌표."},
{s:"도면",t:"CAD",q:"CAD 작업에서 도면 요소를 성격별로 분리·관리하기 위한 기능은?",o:["레이어(Layer)","해치(Hatch)","블록(Block)","트림(Trim)"],a:0,e:"<b>레이어</b>로 지번·경계·건물·선로 등을 분리하면 표시/출력 제어와 데이터 품질관리가 쉬워진다."},
{s:"도면",t:"지적행정",q:"임야대장에 등록된 토지를 토지대장으로 옮겨 등록하는 것은?",o:["등록전환","분할","축척변경","지목변경"],a:0,e:"<b>등록전환</b>. 분할은 1필지를 여러 필지로, 합병은 반대, 축척변경은 소축척을 대축척으로 바꾸는 것."},
{s:"도면",t:"지적행정",q:"토지의 이동(異動)에 해당하지 않는 것은?",o:["신규등록","합병","소유자 주소 변경","지목변경"],a:2,e:"토지이동은 <b>토지의 표시(소재·지번·지목·경계·면적)</b>가 바뀌는 것. 소유자 인적사항 변경은 토지이동이 아니다."},
{s:"도면",t:"측량계산",q:"어떤 측선의 방위각이 240°일 때 역방위각은?",o:["60°","120°","300°","420°"],a:0,e:"역방위각 = 방위각 ± 180°. 240° − 180° = <b>60°</b>."},
{s:"도면",t:"측량계산",q:"폐합트래버스의 정밀도(폐합비) 계산식으로 옳은 것은?",o:["폐합오차 ÷ 측선 수","폐합오차 ÷ 총 측선길이","총 측선길이 ÷ 폐합오차의 제곱","면적 ÷ 폐합오차"],a:1,e:"폐합비 = <b>폐합오차 / 전체 측선 길이</b>이며 1/M 형태로 표현한다."},
{s:"도면",t:"투영",q:"우리나라 지형도·지적도에 주로 쓰는 투영법은?",o:["횡메르카토르(TM) 투영","람베르트 정각원추 투영","정사도법","모르바이데 도법"],a:0,e:"좁고 남북으로 긴 국토에 적합한 <b>TM(횡메르카토르)</b> 투영을 사용한다. UTM은 6° 간격 존으로 나눈 TM의 일종."},
{s:"도면",t:"도면관리",q:"NDIS 기본도로 활용되는 국가기본도에 해당하는 것은?",o:["수치지형도와 지적도","항공사진과 지질도","해도와 등고선도","도시계획도와 건축도면"],a:0,e:"공고 직무설명서상 NDIS 기본도는 <b>수치지형도·지적도 등</b>을 참고해 갱신한다."},
{s:"도면",t:"도면관리",q:"준공도면 정비 시 DB 정확도를 확보하기 위한 QA/QC의 목적으로 가장 적절한 것은?",o:["도면의 미관을 향상시킨다","현장 설비와 DB 간 불일치·오류를 검출·수정한다","도면 용량을 줄인다","도면 축척을 통일한다"],a:1,e:"QA/QC는 <b>현장-DB 일치성 검증과 오류 수정</b>이 목적. NDIS데이터관리원 핵심 직무다."},
{s:"도면",t:"도면관리",q:"도면 신축(수축·팽창)이 발생했을 때 면적 보정 방법으로 옳은 것은?",o:["신축량을 무시한다","신축량에 따른 보정계수를 곱해 보정한다","축척을 변경한다","도면을 재작성하지 않고 그대로 사용한다"],a:1,e:"종이도면은 온·습도로 신축한다. 도곽선 길이를 실측해 <b>신축보정계수</b>를 구해 면적을 보정한다."},

/* ============ 전기 ============ */
{s:"전기",t:"배전",q:"우리나라 표준 배전전압(고압 배전선로)은?",o:["6.6kV","22.9kV-Y 다중접지 3상 4선식","154kV","345kV"],a:1,e:"우리나라 배전 표준은 <b>22.9kV-Y 중성선 다중접지 3상 4선식</b>. 154/345/765kV는 송전전압."},
{s:"전기",t:"배전",q:"우리나라 저압 표준전압으로 옳은 것은?",o:["110V / 220V","220V / 380V","200V / 400V","230V / 400V"],a:1,e:"단상 <b>220V</b>, 3상 <b>380V</b>가 표준. 과거 110V는 1970~90년대 승압사업으로 폐지되었다."},
{s:"전기",t:"기본법칙",q:"저항 6Ω과 3Ω을 병렬 연결했을 때 합성저항은?",o:["2Ω","4.5Ω","9Ω","18Ω"],a:0,e:"1/R = 1/6 + 1/3 = 1/2 → R = <b>2Ω</b>."},
{s:"전기",t:"기본법칙",q:"3상 평형부하의 전력을 구하는 식은?",o:["P = VI cosθ","P = √3 VI cosθ","P = 3VI","P = VI / √3"],a:1,e:"선간전압·선전류 기준 3상 전력 <b>P = √3 VI cosθ</b>."},
{s:"전기",t:"기본법칙",q:"피상전력 100kVA, 역률 0.8일 때 유효전력은?",o:["60kW","80kW","100kW","125kW"],a:1,e:"P = S × cosθ = 100 × 0.8 = <b>80kW</b>. 무효전력 Q = 100×0.6 = 60kVar."},
{s:"전기",t:"역률",q:"역률 개선을 위해 부하와 병렬로 설치하는 기기는?",o:["직렬리액터","전력용 콘덴서","피뢰기","분로리액터"],a:1,e:"<b>전력용 콘덴서(SC)</b>가 진상 무효전력을 공급해 역률을 개선한다. 직렬리액터는 고조파 억제용."},
{s:"전기",t:"역률",q:"역률 개선의 효과로 옳지 않은 것은?",o:["전력손실 감소","전압강하 감소","설비 여유용량 증가","고조파 완전 제거"],a:3,e:"역률 개선은 손실·전압강하 감소, 설비이용률 향상 효과가 있으나 <b>고조파를 제거하지는 못한다</b>(오히려 공진 우려)."},
{s:"전기",t:"손실",q:"배전선로의 전력손실을 나타내는 식은?",o:["I²R","IR","I²R²","VR"],a:0,e:"선로손실 = <b>I²R</b>. 전류가 2배면 손실은 4배가 되므로 승압·역률개선이 손실 저감에 효과적이다."},
{s:"전기",t:"손실",q:"배전선로 전압강하를 줄이는 방법으로 적절하지 않은 것은?",o:["전선 굵기를 크게 한다","배전전압을 승압한다","역률을 개선한다","선로 길이를 늘린다"],a:3,e:"선로가 길어지면 임피던스가 커져 <b>전압강하가 증가</b>한다."},
{s:"전기",t:"변압기",q:"V결선의 이용률과 출력비로 옳은 것은?",o:["이용률 57.7%, 출력비 86.6%","이용률 86.6%, 출력비 57.7%","이용률 100%, 출력비 66.7%","이용률 70.7%, 출력비 50%"],a:1,e:"V결선: 이용률 <b>86.6%(√3/2)</b>, Δ결선 대비 출력비 <b>57.7%(1/√3)</b>."},
{s:"전기",t:"변압기",q:"주상변압기의 주된 역할은?",o:["22.9kV를 220/380V로 강압","전압을 승압해 송전","무효전력 공급","고조파 제거"],a:0,e:"주상변압기는 배전 고압(22.9kV)을 <b>수용가 저압(220/380V)</b>으로 낮춘다."},
{s:"전기",t:"보호기기",q:"주상변압기 1차측에 설치하여 과부하·단락 시 변압기를 보호하는 기기는?",o:["COS(컷아웃스위치)","LA(피뢰기)","ASS","리클로저"],a:0,e:"<b>COS</b>는 퓨즈 용단으로 변압기를 계통에서 분리한다. LA는 뇌·개폐 서지 보호."},
{s:"전기",t:"보호기기",q:"배전선로 고장 시 순간정전 후 자동으로 재폐로하는 기기는?",o:["리클로저(Recloser)","섹셔널라이저","단로기","피뢰기"],a:0,e:"<b>리클로저</b>는 차단-재투입을 반복해 일시고장을 자동복구한다. 섹셔널라이저는 리클로저와 협조해 무전압 구간에서 개방된다."},
{s:"전기",t:"보호기기",q:"피뢰기(LA)의 기능으로 옳은 것은?",o:["정상전류를 차단한다","이상전압을 대지로 방전하고 속류를 차단한다","역률을 개선한다","전압을 승압한다"],a:1,e:"피뢰기는 <b>서지 방전 후 속류 차단</b>으로 기기 절연을 보호한다."},
{s:"전기",t:"전압구분",q:"현행 기준상 교류 저압의 범위는?",o:["600V 이하","750V 이하","1kV 이하","1.5kV 이하"],a:2,e:"2021년 개정 기준: 저압 = 교류 <b>1kV 이하</b>(직류 1.5kV 이하), 고압 = 저압 초과 7kV 이하, 특고압 = 7kV 초과."},
{s:"전기",t:"수용",q:"수용률(demand factor)의 정의로 옳은 것은?",o:["최대수요전력 ÷ 설비용량","평균전력 ÷ 최대전력","각 최대수요의 합 ÷ 합성최대수요","설비용량 ÷ 최대수요전력"],a:0,e:"수용률 = <b>최대수요전력/설비용량</b>, 부하율 = 평균전력/최대전력, 부등률 = 개별최대의 합/합성최대(≥1)."},
{s:"전기",t:"수용",q:"부등률에 대한 설명으로 옳은 것은?",o:["항상 1보다 작다","항상 1 이상이며 클수록 설비 이용이 효율적이다","부하율과 같은 개념이다","단위는 kW다"],a:1,e:"부등률 = 개별 최대수요의 합 ÷ 합성 최대수요 ≥ 1. <b>클수록 최대수요가 분산</b>되어 설비를 효율적으로 쓴다."},
{s:"전기",t:"전선",q:"가공 배전선로에 널리 쓰이는 ACSR 전선의 구조는?",o:["강심 알루미늄 연선","동복강선","알루미늄 단선","절연 동선"],a:0,e:"<b>ACSR = 강심(steel core) 알루미늄 연선</b>. 인장강도는 강심이, 도전은 알루미늄이 담당한다."},
{s:"전기",t:"전선",q:"전선의 굵기를 결정할 때 고려하는 3요소가 아닌 것은?",o:["허용전류","전압강하","기계적 강도","전선의 색상"],a:3,e:"전선 굵기 3대 요소는 <b>허용전류·전압강하·기계적 강도</b>."},
{s:"전기",t:"계통",q:"우리나라 송전전압에 해당하지 않는 것은?",o:["765kV","345kV","154kV","22.9kV"],a:3,e:"<b>22.9kV는 배전전압</b>. 송전은 154/345/765kV, HVDC도 운영 중."},
{s:"전기",t:"계통",q:"우리나라 전력계통의 표준 주파수는?",o:["50Hz","60Hz","50/60Hz 겸용","110Hz"],a:1,e:"우리나라·미국·일본 동부 일부는 <b>60Hz</b>, 유럽·일본 서부는 50Hz."},
{s:"전기",t:"접지",q:"22.9kV-Y 계통에서 중성선을 다중접지하는 주된 목적은?",o:["전력손실 증가","이상전압 억제 및 지락 보호 확실화","역률 개선","고조파 발생"],a:1,e:"다중접지는 <b>대지전위 상승 억제·지락고장 검출 용이·기기 절연레벨 저감</b> 효과가 있다."},
{s:"전기",t:"지중",q:"지중배전 방식의 장점으로 옳지 않은 것은?",o:["도시 미관이 좋다","기상 영향을 덜 받는다","고장점 발견과 복구가 쉽다","감전·접촉 사고 위험이 적다"],a:2,e:"지중선로는 <b>고장점 탐색·복구가 어렵고 건설비가 비싸다</b>는 것이 대표적 단점."},
{s:"전기",t:"지중",q:"지중 배전설비 중 케이블 인출·접속·점검을 위해 설치하는 지하 구조물은?",o:["맨홀(Manhole)","전주","완금","애자"],a:0,e:"<b>맨홀·핸드홀</b>이 지중 관로의 접속·점검 공간. 관로(duct)를 통해 케이블을 포설한다."},
{s:"전기",t:"설비",q:"전주에 설치되어 전선을 지지·절연하는 기자재는?",o:["애자","완금","지선","COS"],a:0,e:"<b>애자(insulator)</b>가 절연 및 지지 역할. 완금은 전선을 배열하는 가로대, 지선은 전주의 넘어짐 방지."},
{s:"전기",t:"설비",q:"인입선에 대한 설명으로 옳은 것은?",o:["발전소에서 변전소까지의 선로","배전선로에서 수용가 인입구까지의 전선","변전소 간 연계선로","송전탑 사이의 가공지선"],a:1,e:"<b>인입선</b>은 배전선로(또는 인입주)에서 수용가 인입구까지. 다른 수용가를 거쳐 분기하면 연접인입선."},
{s:"전기",t:"신기술",q:"AMI(원격검침 인프라)에 대한 설명으로 옳은 것은?",o:["단방향 검침만 가능하다","스마트미터·통신망·운영시스템으로 구성돼 양방향 데이터 수집이 가능하다","전력 생산 설비다","변압기의 일종이다"],a:1,e:"AMI = 스마트미터 + 통신망 + MDMS. 실시간 사용량 수집으로 <b>수요반응·요금제 다양화</b>의 기반이 된다."},
{s:"전기",t:"신기술",q:"분산형전원(태양광 등)이 배전계통에 대량 연계될 때 발생할 수 있는 문제는?",o:["역조류에 의한 전압 상승","전선 굵기 자동 증가","주파수 고정","고장전류 소멸"],a:0,e:"역조류로 <b>말단 전압 상승</b>, 보호협조 복잡화, 단독운전(islanding) 문제가 발생할 수 있다."},

/* ============ PC / 정보처리 ============ */
{s:"PC",t:"진법",q:"2진수 1011 0110을 16진수로 변환하면?",o:["A6","B6","C6","D6"],a:1,e:"1011(=B) 0110(=6) → <b>B6</b>. 4비트씩 끊어서 변환한다."},
{s:"PC",t:"진법",q:"1TB는 몇 GB인가? (2진 기준)",o:["100GB","512GB","1024GB","2048GB"],a:2,e:"KB→MB→GB→TB 각 <b>1024배</b>. 1TB = 1024GB."},
{s:"PC",t:"DB",q:"릴레이션에서 튜플을 유일하게 식별하는 속성(집합)은?",o:["기본키(Primary Key)","외래키(Foreign Key)","도메인","인덱스"],a:0,e:"<b>기본키</b>는 유일성+최소성을 만족하며 NULL을 가질 수 없다. 외래키는 다른 릴레이션의 기본키를 참조."},
{s:"PC",t:"DB",q:"참조하는 값이 반드시 참조되는 릴레이션에 존재해야 한다는 제약은?",o:["개체 무결성","참조 무결성","도메인 무결성","고유 무결성"],a:1,e:"<b>참조 무결성</b>은 외래키 값이 참조 대상의 기본키에 존재하거나 NULL이어야 한다는 제약."},
{s:"PC",t:"DB",q:"제1정규형(1NF)의 조건으로 옳은 것은?",o:["모든 속성이 원자값을 가진다","부분함수 종속을 제거한다","이행함수 종속을 제거한다","다치종속을 제거한다"],a:0,e:"1NF=<b>원자값</b>, 2NF=부분함수종속 제거, 3NF=이행함수종속 제거, BCNF=결정자가 후보키."},
{s:"PC",t:"DB",q:"SQL 명령어 분류가 옳게 짝지어진 것은?",o:["CREATE – DML","SELECT – DDL","GRANT – DCL","COMMIT – DDL"],a:2,e:"DDL: CREATE/ALTER/DROP, DML: SELECT/INSERT/UPDATE/DELETE, DCL: GRANT/REVOKE/COMMIT/ROLLBACK. <b>GRANT는 DCL</b>."},
{s:"PC",t:"DB",q:"트랜잭션의 ACID 특성에 포함되지 않는 것은?",o:["원자성(Atomicity)","일관성(Consistency)","가용성(Availability)","지속성(Durability)"],a:2,e:"ACID = 원자성·일관성·<b>고립성(Isolation)</b>·지속성. 가용성은 시스템 품질속성."},
{s:"PC",t:"엑셀",q:"엑셀에서 수식을 복사해도 참조가 변하지 않도록 하는 표기는?",o:["A1","$A1","A$1","$A$1"],a:3,e:"<b>$A$1</b>이 절대참조. $A1은 열 고정(혼합), A$1은 행 고정(혼합). F4로 순환 전환."},
{s:"PC",t:"엑셀",q:"조건에 맞는 셀의 개수를 세는 함수는?",o:["SUMIF","COUNTIF","VLOOKUP","INDEX"],a:1,e:"<b>COUNTIF(범위, 조건)</b>. 합계는 SUMIF, 다중조건은 COUNTIFS/SUMIFS."},
{s:"PC",t:"엑셀",q:"VLOOKUP 함수의 네 번째 인수를 FALSE(0)로 지정하면?",o:["근사값을 찾는다","정확히 일치하는 값만 찾는다","오름차순 정렬이 필수다","오류를 무시한다"],a:1,e:"FALSE(0)=<b>정확히 일치</b>, TRUE(1)=근사일치(정렬 필요). 실무 데이터 대조에는 FALSE를 쓴다."},
{s:"PC",t:"네트워크",q:"IPv4 주소의 비트 수는?",o:["16비트","32비트","64비트","128비트"],a:1,e:"IPv4는 <b>32비트</b>(8비트씩 4옥텟), IPv6는 128비트."},
{s:"PC",t:"네트워크",q:"OSI 7계층 중 IP가 동작하는 계층은?",o:["데이터링크 계층","네트워크 계층","전송 계층","응용 계층"],a:1,e:"IP는 <b>3계층(네트워크)</b>, TCP/UDP는 4계층(전송), 이더넷·MAC은 2계층."},
{s:"PC",t:"네트워크",q:"TCP와 UDP의 차이로 옳은 것은?",o:["TCP는 비연결형, UDP는 연결형","TCP는 신뢰성 보장, UDP는 속도 우선","둘 다 흐름제어를 한다","UDP는 3-way handshake를 수행한다"],a:1,e:"TCP: 연결형·순서보장·재전송. UDP: 비연결형·오버헤드 작아 <b>실시간/스트리밍</b>에 유리."},
{s:"PC",t:"백업",q:"마지막 전체백업 이후 변경된 데이터를 매번 누적해서 백업하는 방식은?",o:["전체백업","증분백업","차등백업","합성백업"],a:2,e:"<b>차등백업</b>은 전체백업 이후 변경분을 누적(복구 빠름·용량 큼). 증분백업은 직전 백업 이후 변경분만(백업 빠름·복구 느림)."},
{s:"PC",t:"백업",q:"데이터 백업의 3-2-1 원칙에 해당하지 않는 것은?",o:["사본 3개 유지","서로 다른 매체 2종","1개는 외부(off-site) 보관","1일 1회 이상 복원 테스트"],a:3,e:"3-2-1 = <b>사본 3개 / 매체 2종 / 원격지 1개</b>. 복원 테스트는 별도의 권고 사항이다."},
{s:"PC",t:"저장",q:"디스크 2개 이상에 데이터를 분산 저장해 속도를 높이되 내결함성이 없는 RAID 레벨은?",o:["RAID 0","RAID 1","RAID 5","RAID 6"],a:0,e:"RAID 0=스트라이핑(무결함성), RAID 1=미러링, RAID 5=패리티 분산(1개 장애 허용), RAID 6=2개 허용."},
{s:"PC",t:"보안",q:"공개키 암호방식에 대한 설명으로 옳은 것은?",o:["암호화·복호화에 같은 키를 쓴다","공개키로 암호화하고 개인키로 복호화한다","대칭키보다 속도가 빠르다","키 배분 문제가 더 심각하다"],a:1,e:"공개키(비대칭) 방식은 <b>공개키 암호화 → 개인키 복호화</b>. 속도는 느리지만 키 배분·전자서명에 유리(RSA 등)."},
{s:"PC",t:"보안",q:"정보보안의 3대 요소가 아닌 것은?",o:["기밀성","무결성","가용성","확장성"],a:3,e:"CIA = <b>기밀성·무결성·가용성</b>."},
{s:"PC",t:"자료구조",q:"후입선출(LIFO) 구조를 갖는 자료구조는?",o:["큐(Queue)","스택(Stack)","링크드리스트","그래프"],a:1,e:"<b>스택</b>은 LIFO, 큐는 FIFO."},
{s:"PC",t:"테스트",q:"프로그램 내부 구조와 로직을 검증하는 테스트 기법은?",o:["블랙박스 테스트","화이트박스 테스트","인수 테스트","알파 테스트"],a:1,e:"<b>화이트박스</b>는 내부 경로·조건을 검사(기초경로 검사 등), 블랙박스는 입출력 기준(동치분할·경계값 분석)."},
{s:"PC",t:"OS",q:"윈도우에서 '작업 관리자'를 여는 단축키는?",o:["Ctrl + Alt + Del","Ctrl + Shift + Esc","Alt + F4","Win + E"],a:1,e:"<b>Ctrl+Shift+Esc</b>가 바로 실행. Win+E는 탐색기, Alt+F4는 창 종료."},
{s:"PC",t:"데이터품질",q:"데이터 품질 관리에서 '정확성' 확보를 위한 활동으로 가장 적절한 것은?",o:["데이터 용량 확대","현장 실사와 대사(對査)를 통한 검증","화면 디자인 개선","백업 주기 단축"],a:1,e:"NDIS DB 정확도 관리는 <b>현장 설비와 DB의 대사·오류수정</b>이 핵심이다."},

/* ============ 상식: 한국사 ============ */
{s:"상식",t:"한국사",q:"고조선의 8조법 중 현재까지 전해지는 조항이 아닌 것은?",o:["살인자는 사형에 처한다","상해를 입힌 자는 곡식으로 배상한다","도둑질한 자는 노비로 삼는다","반역자는 삼족을 멸한다"],a:3,e:"8조법 중 <b>3개 조항</b>(살인·상해·절도)만 전해진다. 사회에 형벌·사유재산·계급이 있었음을 보여준다."},
{s:"상식",t:"한국사",q:"광개토대왕릉비를 세운 왕은?",o:["소수림왕","광개토대왕","장수왕","고국천왕"],a:2,e:"414년 <b>장수왕</b>이 아버지 광개토대왕의 업적을 기려 건립. 장수왕은 평양 천도(427)를 단행했다."},
{s:"상식",t:"한국사",q:"신라의 신분제도로, 관직 승진과 일상생활까지 제한한 제도는?",o:["골품제","화백제","음서제","과거제"],a:0,e:"<b>골품제</b>. 성골·진골과 6~1두품으로 나뉘어 관등 상한이 정해졌다."},
{s:"상식",t:"한국사",q:"고려 광종이 실시한 정책으로 옳은 것은?",o:["노비안검법과 과거제 시행","훈요 10조 반포","전시과 완성","삼별초 조직"],a:0,e:"광종은 <b>노비안검법(956)·과거제(958)</b>로 호족을 억제하고 왕권을 강화했다."},
{s:"상식",t:"한국사",q:"조선의 기본 법전으로 성종 때 완성된 것은?",o:["경국대전","대전회통","속대전","경제육전"],a:0,e:"<b>경국대전</b>은 세조 때 편찬 시작, 성종 때 완성·반포되어 조선 통치의 근간이 되었다."},
{s:"상식",t:"한국사",q:"공납을 토지 결수에 따라 쌀로 내게 한 조선 후기 제도는?",o:["균역법","대동법","영정법","호포법"],a:1,e:"<b>대동법</b>(광해군 경기 시행 → 숙종 때 전국 확대). 균역법은 군포를 2필→1필로 줄인 영조의 정책."},
{s:"상식",t:"한국사",q:"3·1운동이 일어난 해는?",o:["1910년","1919년","1926년","1929년"],a:1,e:"<b>1919년</b> 3·1운동 → 같은 해 대한민국 임시정부 수립, 일제 통치가 무단통치에서 문화통치로 전환."},
{s:"상식",t:"한국사",q:"1929년 광주에서 시작되어 전국으로 확산된 항일운동은?",o:["6·10만세운동","광주학생항일운동","물산장려운동","형평운동"],a:1,e:"<b>광주학생항일운동(1929)</b>은 3·1운동 이후 최대 규모의 학생 항일운동이다."},
{s:"상식",t:"한국사",q:"6·25 전쟁의 발발 연도와 정전협정 체결 연도는?",o:["1948년 – 1951년","1950년 – 1953년","1950년 – 1955년","1953년 – 1960년"],a:1,e:"<b>1950년 6월 25일 발발, 1953년 7월 27일 정전협정</b> 체결."},
{s:"상식",t:"한국사",q:"1980년 신군부에 맞서 일어난 민주화운동은?",o:["4·19혁명","부마민주항쟁","5·18 광주민주화운동","6월 민주항쟁"],a:2,e:"<b>5·18 광주민주화운동(1980)</b>. 4·19는 1960년, 6월 민주항쟁은 1987년(6·29선언)."},

/* ============ 상식: 전력사업·회사 ============ */
{s:"상식",t:"회사",q:"한국전력공사의 설립 근거 법률은?",o:["전기사업법","한국전력공사법","공공기관의 운영에 관한 법률","에너지법"],a:1,e:"<b>한국전력공사법</b>에 의해 설립된 법인이며, 공공기관운영법상 <b>시장형 공기업</b>으로 분류된다."},
{s:"상식",t:"회사",q:"한국전력공사 본사가 위치한 곳은?",o:["서울 삼성동","경기 성남","전남 나주 빛가람혁신도시","세종특별자치시"],a:2,e:"2014년 12월 서울 삼성동에서 <b>전남 나주 빛가람혁신도시</b>로 본사를 이전했다."},
{s:"상식",t:"회사",q:"한국전력공사의 발전 자회사에 해당하지 않는 것은?",o:["한국수력원자력","한국남동발전","한국전력기술","한국동서발전"],a:2,e:"발전 6사는 한수원·남동·중부·서부·남부·동서. <b>한전기술(KEPCO E&C)</b>은 설계 엔지니어링 자회사(그 외 한전KPS·한전KDN·한전원자력연료)."},
{s:"상식",t:"회사",q:"전력시장을 운영하며 계통 급전을 담당하는 기관은?",o:["한국전력거래소(KPX)","한국에너지공단","전기안전공사","한국전력기술"],a:0,e:"<b>KPX(전력거래소)</b>가 전력시장 운영과 계통운영(급전)을 맡고, 한전은 송·배전과 판매를 담당한다."},
{s:"상식",t:"회사",q:"한국전력공사의 인재상 4가지에 해당하지 않는 것은?",o:["기업가형 인재","통섭형 인재","도전적 인재","순응형 인재"],a:3,e:"KEPCO 인재상은 <b>기업가형·통섭형·도전적·가치창조형 인재</b>. 자소서·면접에서 자주 인용된다."},
{s:"상식",t:"전력사업",q:"우리나라 전기요금 청구서의 구성 항목이 아닌 것은?",o:["기본요금","전력량요금","기후환경요금","설비투자요금"],a:3,e:"전기요금 = <b>기본요금 + 전력량요금 + 기후환경요금 + 연료비조정요금</b>(+부가세·전력기금)."},
{s:"상식",t:"전력사업",q:"주택용 전력에 적용되는 누진제의 현행 단계는?",o:["2단계","3단계","4단계","6단계"],a:1,e:"2016년 개편으로 <b>3단계(200kWh 이하 / 201~400 / 400 초과)</b>로 완화되었다."},

const SUBS=["전체","도면","전기","PC","상식"];
let cur="전체", idx=0, ans={}, order=[];

const nav=document.getElementById('nav'), view=document.getElementById('view'), bar=document.getElementById('bar');
nav.innerHTML=[...SUBS,"요약","계획"].map(s=>`<button data-s="${s}">${s==="전체"?"전체 문제":s}</button>`).join('');
nav.onclick=e=>{const b=e.target.closest('button'); if(!b)return; cur=b.dataset.s; idx=0; if(SUBS.includes(cur)){ans={};build();} render();};

function build(){order=Q.map((q,i)=>i).filter(i=>cur==="전체"||Q[i].s===cur);}
function sel(b){[...nav.children].forEach(x=>x.setAttribute('aria-selected',x.dataset.s===cur));}

function render(){
  sel();
  if(cur==="요약"){bar.style.width="0";view.innerHTML=SUMMARY;window.scrollTo(0,0);return;}
  if(cur==="계획"){bar.style.width="0";view.innerHTML=PLAN;window.scrollTo(0,0);return;}
  if(!order.length)build();
  const total=order.length, answered=Object.keys(ans).length;
  bar.style.width=(answered/total*100)+"%";

  if(idx>=total){
    const right=Object.entries(ans).filter(([k,v])=>Q[k].a===v).length;
    const wrongIds=Object.entries(ans).filter(([k,v])=>Q[k].a!==v).map(([k])=>+k);
    view.innerHTML=`<div class="done"><div class="score">${right} / ${total}</div>
      <p>정답률 ${Math.round(right/total*100)}%${wrongIds.length?` · 틀린 문제 ${wrongIds.length}개`:" · 전부 정답"}</p>
      <div class="act" style="justify-content:center">
        ${wrongIds.length?`<button class="btn warn" id="again">틀린 문제만 다시 풀기</button>`:""}
        <button class="btn solid" id="reset">처음부터 다시</button></div></div>`;
    const a=document.getElementById('again');
    if(a)a.onclick=()=>{order=wrongIds;ans={};idx=0;render();};
    document.getElementById('reset').onclick=()=>{ans={};idx=0;build();render();};
    window.scrollTo(0,0);return;
  }

  const id=order[idx], q=Q[id], picked=ans[id];
  view.innerHTML=`
    <div class="meta"><span>${String(idx+1).padStart(2,'0')} / ${String(total).padStart(2,'0')} · ${q.s} · ${q.t}</span>
      <em>${Object.entries(ans).filter(([k,v])=>Q[k].a===v).length}점</em></div>
    <div class="card">
      <div class="tag">Q${String(idx+1).padStart(2,'0')}</div>
      <div class="qt">${q.q}</div>
      <div id="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="n">${i+1}</span>${o}</button>`).join('')}</div>
      <div id="exp"></div>
    </div>
    <div class="act">
      <button class="btn" id="prev" ${idx===0?'disabled style="opacity:.4"':''}>← 이전</button>
      <button class="btn ${picked!==undefined?'solid':''}" id="next">${idx===total-1?'채점하기':'다음 →'}</button>
    </div>`;

  const opts=document.getElementById('opts');
  const show=()=>{
    [...opts.children].forEach((b,i)=>{b.disabled=true;
      if(i===q.a)b.classList.add('right');
      else if(i===ans[id])b.classList.add('wrong');});
    document.getElementById('exp').innerHTML=`<div class="exp"><b>정답 ${q.a+1}번.</b> ${q.e}</div>`;
    document.getElementById('next').classList.add('solid');
  };
  if(picked!==undefined)show();
  opts.onclick=e=>{const b=e.target.closest('.opt'); if(!b||ans[id]!==undefined)return;
    ans[id]=+b.dataset.i; show(); bar.style.width=(Object.keys(ans).length/total*100)+"%";};
  document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render();}};
  document.getElementById('next').onclick=()=>{idx++;render();};
  window.scrollTo(0,0);
}
